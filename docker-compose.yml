services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yami
      POSTGRES_USER: yami
      POSTGRES_PASSWORD: yami_dev_password
    ports:
      - "5432:5432"
    volumes:
      - yami_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yami -d yami"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/yami_dev_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - yami_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p yami_dev_password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  yami_pg_data:
  yami_neo4j_data:
