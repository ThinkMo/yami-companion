<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>芽米家长端 · 6 种 UI 风格方案对比（UI-UX-Pro-Max）</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #111318; color: #F8FAFC; }

    /* Master Switcher Bar */
    .studio-bar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 10px 20px; background: rgba(17, 19, 24, 0.92); backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .studio-title { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
    .studio-tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(45,212,191,0.15); color: #5EEAD4; }
    .studio-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .studio-btn {
      border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: #CBD5E1;
      padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer;
      transition: all 140ms ease;
    }
    .studio-btn:hover { background: rgba(255,255,255,0.12); color: #FFF; }
    .studio-btn.active { background: #FFFFFF; color: #0F172A; border-color: #FFFFFF; }
    .studio-sub-tabs { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.06); padding: 3px; border-radius: 999px; }
    .studio-tab {
      border: none; background: transparent; color: #94A3B8; padding: 5px 11px; border-radius: 999px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .studio-tab.active { background: #334155; color: #FFF; }

    /* Overview 6-up Grid */
    .overview-wrap { padding: 22px; max-width: 1520px; margin: 0 auto; }
    .overview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    @media (max-width: 1180px) { .overview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 740px) { .overview-grid { grid-template-columns: 1fr; } }

    .style-card-outer {
      border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12);
      background: #181C24; display: flex; flex-direction: column;
      transition: transform 180ms ease, border-color 180ms ease;
    }
    .style-card-outer:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.32); }
    .style-card-meta {
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .style-card-name { font-size: 15px; font-weight: 700; color: #FFF; }
    .style-card-desc { font-size: 12px; color: #94A3B8; margin-top: 2px; }
    .swatches { display: flex; gap: 5px; margin-top: 6px; }
    .sw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); }
    .open-full-btn {
      flex-shrink: 0; border: none; background: #FFF; color: #0F172A; font-size: 12px; font-weight: 700;
      padding: 7px 12px; border-radius: 999px; cursor: pointer;
    }
    .preview-viewport {
      height: 410px; overflow: hidden; position: relative; cursor: pointer;
    }
    .preview-scaler {
      width: 142.85%; height: 142.85%; transform: scale(0.7); transform-origin: top left;
      pointer-events: none;
    }

    /* Fullscreen Interactive Mode */
    .full-stage { min-height: calc(100vh - 56px); }

    /* =====================================================================
       SHARED MOCKUP SKELETON (Scoped by .theme-*)
       ===================================================================== */
    .yami-app {
      min-height: 100%; display: flex; flex-direction: column;
      background: var(--bg); color: var(--fg); font-family: var(--font-body);
    }
    .yami-app h1, .yami-app h2, .yami-app h3 { font-family: var(--font-head); letter-spacing: -0.02em; }

    /* Top Header */
    .ym-header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 24px; background: var(--header-bg); border-bottom: var(--header-border);
      backdrop-filter: var(--header-blur);
    }
    .ym-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
    .ym-logo {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      background: var(--accent); color: var(--accent-fg);
      display: grid; place-items: center; font-weight: 800; font-size: 14px;
    }
    .ym-nav-top {
      display: flex; align-items: center; gap: 4px;
      background: var(--nav-pill-bg); padding: 4px; border-radius: var(--radius-pill);
      border: var(--nav-pill-border);
    }
    .ym-nav-item {
      border: none; background: transparent; color: var(--muted);
      padding: 7px 16px; border-radius: var(--radius-pill); font-size: 13.5px; font-weight: 600; cursor: pointer;
      transition: all 140ms ease;
    }
    .ym-nav-item.active {
      background: var(--nav-active-bg); color: var(--nav-active-fg); box-shadow: var(--nav-active-shadow);
    }
    .ym-header-right { display: flex; align-items: center; gap: 8px; }
    .ym-chip-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
      border-radius: var(--radius-pill); background: var(--surface); border: var(--card-border);
      color: var(--fg); font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    .ym-avatar {
      width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-fg);
      display: grid; place-items: center; font-size: 11px; font-weight: 700;
    }

    /* Body Shell (supports top-nav OR sidebar layout via CSS!) */
    .ym-shell { display: flex; flex: 1; max-width: 1180px; width: 100%; margin: 0 auto; padding: 22px 24px 40px; gap: 22px; }
    .ym-sidebar { display: none; width: 204px; flex-shrink: 0; flex-direction: column; gap: 4px; }
    .ym-main { flex: 1; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

    /* Cards & Grids */
    .ym-kpi-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .ym-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 820px) { .ym-kpi-row, .ym-grid-2 { grid-template-columns: 1fr; } }

    .ym-card {
      background: var(--surface); border: var(--card-border); border-radius: var(--radius-card);
      box-shadow: var(--card-shadow); padding: 18px 20px; backdrop-filter: var(--card-blur);
    }
    .ym-card-soft { background: var(--surface-soft); }
    .ym-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .ym-card-title { font-size: 15px; font-weight: 700; }
    .ym-muted { font-size: 12.5px; color: var(--muted); }
    .ym-kpi-num { font-size: 28px; font-weight: 800; line-height: 1.1; margin-top: 6px; letter-spacing: -0.03em; }
    .ym-badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px;
      border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 600;
      background: var(--badge-bg); color: var(--badge-fg);
    }
    .ym-badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
    .ym-badge.warn { background: var(--warn-bg); color: var(--warn-fg); }

    .ym-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 7px 14px; border-radius: var(--radius-btn); font-size: 12.5px; font-weight: 600;
      cursor: pointer; border: none; transition: all 140ms ease;
    }
    .ym-btn-primary { background: var(--accent); color: var(--accent-fg); box-shadow: var(--btn-shadow); }
    .ym-btn-ghost { background: var(--surface-soft); color: var(--fg); border: var(--card-border); }

    .ym-list { display: flex; flex-direction: column; gap: 10px; }
    .ym-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px 13px; border-radius: var(--radius-sm);
      background: var(--row-bg); border: var(--row-border);
    }
    .ym-row-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .ym-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--accent); }
    .ym-dot.ok { background: var(--ok-fg); }
    .ym-dot.warn { background: var(--warn-fg); }
    .ym-row-title { font-size: 13.5px; font-weight: 600; }
    .ym-row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Calendar Grid */
    .ym-cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
    .ym-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .ym-cal-cell {
      height: 44px; border-radius: var(--radius-sm); display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
      background: var(--cal-0); color: var(--muted); position: relative;
    }
    .ym-cal-cell.lv1 { background: var(--cal-1); color: var(--fg); }
    .ym-cal-cell.lv2 { background: var(--cal-2); color: var(--fg); }
    .ym-cal-cell.lv3 { background: var(--cal-3); color: #FFF; }
    .ym-cal-cell.today { outline: 2px solid var(--accent); outline-offset: -2px; color: var(--fg); }
    .ym-cal-cell.today.lv3 { color: #FFF; }
    .ym-cal-today-tag { position: absolute; top: 2px; left: 4px; font-size: 9px; font-weight: 800; color: var(--accent); }
    .ym-cal-cell.today.lv3 .ym-cal-today-tag { color: #FFF; }
    .ym-cal-pct { font-size: 10px; opacity: 0.85; font-weight: 500; }

    /* Input */
    .ym-input-row { display: flex; gap: 8px; }
    .ym-input {
      flex: 1; padding: 8px 12px; border-radius: var(--radius-sm);
      border: var(--card-border); background: var(--input-bg); color: var(--fg); font-size: 13px;
    }

    /* =====================================================================
       THEME 1: APPLE BENTO (Minimalist Airy Bento Grid)
       ===================================================================== */
    .theme-bento {
      --bg: #F5F5F7; --fg: #1D1D1F; --muted: #6E6E73;
      --surface: #FFFFFF; --surface-soft: #F5F5F7; --input-bg: #F5F5F7;
      --header-bg: rgba(255,255,255,0.82); --header-border: 1px solid rgba(0,0,0,0.06); --header-blur: blur(18px);
      --nav-pill-bg: #EBEBF0; --nav-pill-border: none; --nav-active-bg: #FFFFFF; --nav-active-fg: #1D1D1F; --nav-active-shadow: 0 2px 8px rgba(0,0,0,0.08);
      --accent: #0071E3; --accent-fg: #FFFFFF;
      --ok-bg: #E8F8EE; --ok-fg: #1E8E3E; --warn-bg: #FFF4E5; --warn-fg: #C25E00;
      --badge-bg: #F0F0F5; --badge-fg: #424245;
      --card-border: 1px solid rgba(0,0,0,0.05); --card-shadow: 0 4px 20px rgba(0,0,0,0.04); --card-blur: none;
      --row-bg: #F9F9FB; --row-border: 1px solid rgba(0,0,0,0.04);
      --radius-card: 22px; --radius-sm: 14px; --radius-btn: 999px; --radius-pill: 999px;
      --btn-shadow: none;
      --cal-0: #F2F2F7; --cal-1: #D4E8FF; --cal-2: #7BB8FF; --cal-3: #0071E3;
      --font-head: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    /* =====================================================================
       THEME 2: LINEAR SWISS (Ultra-Clean Sidebar + 1px Precision Grid)
       ===================================================================== */
    .theme-linear {
      --bg: #FFFFFF; --fg: #09090B; --muted: #71717A;
      --surface: #FFFFFF; --surface-soft: #FAFAFA; --input-bg: #FFFFFF;
      --header-bg: #FFFFFF; --header-border: 1px solid #E4E4E7; --header-blur: none;
      --nav-pill-bg: transparent; --nav-pill-border: none; --nav-active-bg: #F4F4F5; --nav-active-fg: #09090B; --nav-active-shadow: none;
      --accent: #4F46E5; --accent-fg: #FFFFFF;
      --ok-bg: #ECFDF5; --ok-fg: #059669; --warn-bg: #FEF3C7; --warn-fg: #B45309;
      --badge-bg: #F4F4F5; --badge-fg: #3F3F46;
      --card-border: 1px solid #E4E4E7; --card-shadow: none; --card-blur: none;
      --row-bg: #FFFFFF; --row-border: 1px solid #F4F4F5;
      --radius-card: 10px; --radius-sm: 6px; --radius-btn: 6px; --radius-pill: 6px;
      --btn-shadow: none;
      --cal-0: #F4F4F5; --cal-1: #E0E7FF; --cal-2: #A5B4FC; --cal-3: #4F46E5;
      --font-head: "Inter", -apple-system, "PingFang SC", sans-serif;
      --font-body: "Inter", -apple-system, "PingFang SC", sans-serif;
    }
    .theme-linear .ym-nav-top { display: none; }
    .theme-linear .ym-sidebar { display: flex; border-right: 1px solid #E4E4E7; padding-right: 16px; }
    .theme-linear .ym-side-btn {
      text-align: left; border: none; background: transparent; color: #52525B;
      padding: 8px 12px; border-radius: 6px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    }
    .theme-linear .ym-side-btn.active { background: #EEF2FF; color: #4338CA; }
    .theme-linear .ym-card { padding: 14px 16px; }

    /* =====================================================================
       THEME 3: WARM EDITORIAL / MUJI STATIONERY (Japanese Paper Journal)
       ===================================================================== */
    .theme-editorial {
      --bg: #FAF7F2; --fg: #2C2621; --muted: #786D63;
      --surface: #FFFDF9; --surface-soft: #F3EDE3; --input-bg: #FAF7F2;
      --header-bg: #FAF7F2; --header-border: 1px solid #E6DDD0; --header-blur: none;
      --nav-pill-bg: transparent; --nav-pill-border: 1px solid #E6DDD0; --nav-active-bg: #2C2621; --nav-active-fg: #FAF7F2; --nav-active-shadow: none;
      --accent: #C85A32; --accent-fg: #FFFDF9;
      --ok-bg: #EAF1EC; --ok-fg: #3E634B; --warn-bg: #FBF0E6; --warn-fg: #B85227;
      --badge-bg: #EFE9DF; --badge-fg: #5C5248;
      --card-border: 1px solid #E6DDD0; --card-shadow: 0 2px 10px rgba(44,38,33,0.03); --card-blur: none;
      --row-bg: #FAF7F2; --row-border: 1px solid #ECE4D8;
      --radius-card: 14px; --radius-sm: 8px; --radius-btn: 8px; --radius-pill: 999px;
      --btn-shadow: none;
      --cal-0: #F2ECE2; --cal-1: #E3EBDF; --cal-2: #9DC0A7; --cal-3: #4A6B53;
      --font-head: "Songti SC", "Noto Serif SC", Georgia, serif;
      --font-body: -apple-system, "PingFang SC", sans-serif;
    }

    /* =====================================================================
       THEME 4: SOFT CLAYMORPHISM (Friendly Tactile Education)
       ===================================================================== */
    .theme-clay {
      --bg: #EDF6FF; --fg: #133A4A; --muted: #527382;
      --surface: #FFFFFF; --surface-soft: #F4FAFF; --input-bg: #F4FAFF;
      --header-bg: rgba(255,255,255,0.9); --header-border: 2px solid #D7ECFF; --header-blur: blur(12px);
      --nav-pill-bg: #DFF0FF; --nav-pill-border: 2px solid #C8E4FF; --nav-active-bg: #0D9488; --nav-active-fg: #FFFFFF; --nav-active-shadow: 0 4px 0 #0F766E;
      --accent: #0D9488; --accent-fg: #FFFFFF;
      --ok-bg: #CCFBF1; --ok-fg: #0F766E; --warn-bg: #FFEDD5; --warn-fg: #C2410C;
      --badge-bg: #E0F2FE; --badge-fg: #0369A1;
      --card-border: 2px solid #D7ECFF;
      --card-shadow: 0 8px 20px rgba(13,148,136,0.08), inset 0 -3px 0 rgba(186,230,253,0.6);
      --card-blur: none;
      --row-bg: #F7FBFF; --row-border: 1.5px solid #DCEEFF;
      --radius-card: 22px; --radius-sm: 14px; --radius-btn: 14px; --radius-pill: 999px;
      --btn-shadow: 0 3px 0 #0F766E;
      --cal-0: #EFF6FF; --cal-1: #CCFBF1; --cal-2: #5EEAD4; --cal-3: #0D9488;
      --font-head: "PingFang SC", "Hiragino Sans GB", sans-serif;
      --font-body: "PingFang SC", "Hiragino Sans GB", sans-serif;
    }

    /* =====================================================================
       THEME 5: AURORA LIGHT GLASSMORPHISM (VisionOS Frosted Glass)
       ===================================================================== */
    .theme-glass {
      --bg: linear-gradient(135deg, #E0F2FE 0%, #ECFEFF 42%, #F3E8FF 100%);
      --fg: #0F172A; --muted: #475569;
      --surface: rgba(255,255,255,0.68); --surface-soft: rgba(255,255,255,0.48); --input-bg: rgba(255,255,255,0.75);
      --header-bg: rgba(255,255,255,0.62); --header-border: 1px solid rgba(255,255,255,0.75); --header-blur: blur(20px);
      --nav-pill-bg: rgba(255,255,255,0.55); --nav-pill-border: 1px solid rgba(255,255,255,0.8);
      --nav-active-bg: #0284C7; --nav-active-fg: #FFFFFF; --nav-active-shadow: 0 4px 12px rgba(2,132,199,0.28);
      --accent: #0284C7; --accent-fg: #FFFFFF;
      --ok-bg: rgba(16,185,129,0.16); --ok-fg: #047857; --warn-bg: rgba(245,158,11,0.18); --warn-fg: #B45309;
      --badge-bg: rgba(255,255,255,0.7); --badge-fg: #334155;
      --card-border: 1px solid rgba(255,255,255,0.85);
      --card-shadow: 0 10px 30px rgba(15,23,42,0.06);
      --card-blur: blur(18px);
      --row-bg: rgba(255,255,255,0.6); --row-border: 1px solid rgba(255,255,255,0.8);
      --radius-card: 20px; --radius-sm: 12px; --radius-btn: 999px; --radius-pill: 999px;
      --btn-shadow: 0 4px 12px rgba(2,132,199,0.25);
      --cal-0: rgba(255,255,255,0.55); --cal-1: #BAE6FD; --cal-2: #38BDF8; --cal-3: #0284C7;
      --font-head: -apple-system, "PingFang SC", sans-serif;
      --font-body: -apple-system, "PingFang SC", sans-serif;
    }

    /* =====================================================================
       THEME 6: CALM MIDNIGHT DARK (Night Homework Eye-Care Mode)
       ===================================================================== */
    .theme-midnight {
      --bg: #0B1120; --fg: #F1F5F9; --muted: #94A3B8;
      --surface: #151E31; --surface-soft: #1E293B; --input-bg: #0F172A;
      --header-bg: rgba(11,17,32,0.88); --header-border: 1px solid #1E293B; --header-blur: blur(14px);
      --nav-pill-bg: #151E31; --nav-pill-border: 1px solid #24324D;
      --nav-active-bg: #2DD4BF; --nav-active-fg: #042F2E; --nav-active-shadow: none;
      --accent: #2DD4BF; --accent-fg: #042F2E;
      --ok-bg: rgba(45,212,191,0.16); --ok-fg: #5EEAD4; --warn-bg: rgba(251,191,36,0.16); --warn-fg: #FCD34D;
      --badge-bg: #1E293B; --badge-fg: #CBD5E1;
      --card-border: 1px solid #24324D; --card-shadow: 0 8px 24px rgba(0,0,0,0.35); --card-blur: none;
      --row-bg: #0F172A; --row-border: 1px solid #1E293B;
      --radius-card: 16px; --radius-sm: 10px; --radius-btn: 10px; --radius-pill: 999px;
      --btn-shadow: none;
      --cal-0: #1E293B; --cal-1: #134E4A; --cal-2: #0F766E; --cal-3: #14B8A6;
      --font-head: "Inter", -apple-system, "PingFang SC", sans-serif;
      --font-body: "Inter", -apple-system, "PingFang SC", sans-serif;
    }
  </style>
</head>
<body>
  <div class="studio-bar">
    <div class="studio-title">
      <span>芽米家长端 · 6 套 UI 风格方案</span>
      <span class="studio-tag">UI-UX-Pro-Max</span>
    </div>
    <div class="studio-pills" id="mode-pills">
      <button class="studio-btn active" data-mode="overview" onclick="setMode('overview')">六风格总览对比</button>
      <button class="studio-btn" data-mode="bento" onclick="setMode('bento')">① Apple Bento</button>
      <button class="studio-btn" data-mode="linear" onclick="setMode('linear')">② Linear 效率</button>
      <button class="studio-btn" data-mode="editorial" onclick="setMode('editorial')">③ 日系手账暖纸</button>
      <button class="studio-btn" data-mode="clay" onclick="setMode('clay')">④ 柔和黏土童趣</button>
      <button class="studio-btn" data-mode="glass" onclick="setMode('glass')">⑤ 极光磨砂玻璃</button>
      <button class="studio-btn" data-mode="midnight" onclick="setMode('midnight')">⑥ 夜间护眼深色</button>
    </div>
    <div class="studio-sub-tabs" id="page-tabs">
      <button class="studio-tab active" data-page="today" onclick="setPage('today')">今日</button>
      <button class="studio-tab" data-page="growth" onclick="setPage('growth')">成长</button>
      <button class="studio-tab" data-page="skills" onclick="setPage('skills')">技能</button>
      <button class="studio-tab" data-page="settings" onclick="setPage('settings')">设置</button>
    </div>
  </div>

  <div id="stage"></div>

  <script>
    const STYLES = [
      {
        id: 'bento',
        name: '① Apple Bento 极简清透',
        desc: 'iOS / Apple Health 风格 · 纯白大圆角卡片 + 通透留白 + 系统蓝',
        swatches: ['#F5F5F7', '#FFFFFF', '#0071E3', '#1E8E3E'],
      },
      {
        id: 'linear',
        name: '② Linear 极客效率风',
        desc: '左侧窄边栏 + 1px 精准线框 · 零多余装饰，极速扫视日程与任务',
        swatches: ['#FFFFFF', '#E4E4E7', '#4F46E5', '#059669'],
      },
      {
        id: 'editorial',
        name: '③ 日系手账暖纸风',
        desc: '暖米纸底 + 衬线标题 + 陶土橘与橄榄绿 · 温润安静适合家庭阅读',
        swatches: ['#FAF7F2', '#FFFDF9', '#C85A32', '#4A6B53'],
      },
      {
        id: 'clay',
        name: '④ 柔和黏土童趣风',
        desc: '立体柔光双阴影 + 活力青 · 亲切有趣，家长与孩子一起看也喜欢',
        swatches: ['#EDF6FF', '#FFFFFF', '#0D9488', '#C2410C'],
      },
      {
        id: 'glass',
        name: '⑤ 极光磨砂玻璃风',
        desc: '冰蓝薄荷柔光底 + visionOS 毛玻璃悬浮卡片 · 现代精致层次感',
        swatches: ['#E0F2FE', '#FFFFFF', '#0284C7', '#047857'],
      },
      {
        id: 'midnight',
        name: '⑥ 夜间护眼深色风',
        desc: '深石板蓝 + 柔和青绿 · 专为晚间 8–10 点陪娃写作业护眼打造',
        swatches: ['#0B1120', '#151E31', '#2DD4BF', '#FCD34D'],
      },
    ];

    let currentMode = 'overview';
    let currentPage = 'today';

    function renderMockContent(page) {
      if (page === 'growth') {
        const now = new Date();
        const y = now.getFullYear(), m = now.getMonth() + 1, todayD = now.getDate();
        const daysInMonth = new Date(y, m, 0).getDate();
        const firstW = new Date(y, m - 1, 1).getDay();
        const lvMap = [0, 3, 2, 3, 3, 1, 3, 2, 3, 3, 0, 3, 2, 3, 1, 3, 3, 2, 3, 3, 2, 3];
        let cells = '';
        for (let i = 0; i < firstW; i++) cells += '<div></div>';
        for (let d = 1; d <= daysInMonth; d++) {
          const isToday = d === todayD;
          const lv = d <= todayD ? (lvMap[d % lvMap.length] || 0) : 0;
          const pct = lv === 3 ? '100%' : lv === 2 ? '75%' : lv === 1 ? '40%' : '·';
          cells += `
            <div class="ym-cal-cell ${lv ? 'lv' + lv : ''} ${isToday ? 'today' : ''}">
              ${isToday ? '<span class="ym-cal-today-tag">今</span>' : ''}
              <span>${d}</span>
              <span class="ym-cal-pct">${pct}</span>
            </div>`;
        }
        return `
          <div class="ym-kpi-row">
            <div class="ym-card"><div class="ym-muted">本月作业平均完成</div><div class="ym-kpi-num">92%</div></div>
            <div class="ym-card"><div class="ym-muted">自定义任务连胜</div><div class="ym-kpi-num">6 天</div></div>
            <div class="ym-card"><div class="ym-muted">情绪晴雨表</div><div class="ym-kpi-num" style="font-size:20px;margin-top:10px;"><span class="ym-badge ok">情绪平稳</span></div></div>
          </div>
          <div class="ym-card">
            <div class="ym-card-head">
              <div style="display:flex;align-items:center;gap:8px;">
                <h2 class="ym-card-title">学习完成月历</h2>
                <span class="ym-badge ok">今天 ${y}年${m}月${todayD}日</span>
              </div>
              <div style="display:flex;gap:6px;">
                <span class="ym-badge">${y}-${String(m).padStart(2,'0')}</span>
                <button class="ym-btn ym-btn-ghost" type="button">回到今天</button>
              </div>
            </div>
            <div class="ym-cal-head"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div class="ym-cal-grid">${cells}</div>
          </div>
          <div class="ym-grid-2">
            <div class="ym-card">
              <div class="ym-card-head"><h3 class="ym-card-title">教材学情 · 四年级数学</h3><span class="ym-badge ok">5/8 单元</span></div>
              <div class="ym-list">
                <div class="ym-row"><span class="ym-row-title">第 3 单元 · 角的度量</span><span class="ym-badge ok">已掌握</span></div>
                <div class="ym-row"><span class="ym-row-title">第 4 单元 · 三位数乘两位数</span><span class="ym-badge warn">巩固中</span></div>
              </div>
            </div>
            <div class="ym-card">
              <div class="ym-card-head"><h3 class="ym-card-title">语音对话记录</h3><span class="ym-badge">按天筛选</span></div>
              <div class="ym-list">
                <div class="ym-row"><div><div class="ym-row-title">孩子：这道竖式乘法老算错</div><div class="ym-row-sub">芽米：我们把十位对齐再验算一次</div></div><span class="ym-badge">作业陪伴</span></div>
              </div>
            </div>
          </div>`;
      }

      if (page === 'skills') {
        return `
          <div class="ym-grid-2">
            <div class="ym-card">
              <div class="ym-card-head"><div><h3 class="ym-card-title">作业陪伴与分级答疑</h3><div class="ym-muted">已调用 28 次</div></div><span class="ym-badge ok">已启用</span></div>
              <p class="ym-muted" style="margin-bottom:12px;">复习 → 写作业 → 预习全流程，苏格拉底式线索引导</p>
              <div style="display:flex;justify-content:space-between;align-items:center;"><span class="ym-badge">核心技能</span><button class="ym-btn ym-btn-ghost" type="button">暂停</button></div>
            </div>
            <div class="ym-card">
              <div class="ym-card-head"><div><h3 class="ym-card-title">语文/英语纯语音听写</h3><div class="ym-muted">已调用 14 次</div></div><span class="ym-badge ok">已启用</span></div>
              <p class="ym-muted" style="margin-bottom:12px;">按年级教材逐词报读、不露字形、错词自动进次日巩固</p>
              <div style="display:flex;justify-content:space-between;align-items:center;"><span class="ym-badge">可选技能</span><button class="ym-btn ym-btn-ghost" type="button">暂停</button></div>
            </div>
            <div class="ym-card">
              <div class="ym-card-head"><div><h3 class="ym-card-title">双语英语口语陪练</h3><div class="ym-muted">已调用 6 次</div></div><span class="ym-badge">已暂停</span></div>
              <p class="ym-muted" style="margin-bottom:12px;">日常场景双语对话与温和纠音鼓励</p>
              <div style="display:flex;justify-content:space-between;align-items:center;"><span class="ym-badge">可选技能</span><button class="ym-btn ym-btn-primary" type="button">启用</button></div>
            </div>
            <div class="ym-card">
              <div class="ym-card-head"><div><h3 class="ym-card-title">芽米宠物小屋激励</h3><div class="ym-muted">已调用 19 次</div></div><span class="ym-badge ok">已启用</span></div>
              <p class="ym-muted" style="margin-bottom:12px;">完成任务赚宠粮币、喂食陪伴、与 Mosaico 1:1 同步</p>
              <div style="display:flex;justify-content:space-between;align-items:center;"><span class="ym-badge">可选技能</span><button class="ym-btn ym-btn-ghost" type="button">暂停</button></div>
            </div>
          </div>`;
      }

      if (page === 'settings') {
        return `
          <div class="ym-grid-2">
            <div class="ym-card">
              <div class="ym-card-head"><h3 class="ym-card-title">学生档案</h3><button class="ym-btn ym-btn-primary" type="button">保存</button></div>
              <div class="ym-list">
                <div class="ym-row"><span class="ym-muted">姓名 / 年级</span><span class="ym-row-title">小禾 · 四年级</span></div>
                <div class="ym-row"><span class="ym-muted">语文 / 数学教材</span><span class="ym-row-title">统编版 / 人教版</span></div>
              </div>
            </div>
            <div class="ym-card">
              <div class="ym-card-head"><h3 class="ym-card-title">Mosaico 设备绑定</h3><span class="ym-badge ok">在线</span></div>
              <div class="ym-input-row"><input class="ym-input" placeholder="输入 6 位配对码" /><button class="ym-btn ym-btn-primary" type="button">绑定</button></div>
            </div>
          </div>
          <div class="ym-card">
            <div class="ym-card-head"><h3 class="ym-card-title">钉钉集成配置</h3><button class="ym-btn ym-btn-primary" type="button">保存配置</button></div>
            <div class="ym-grid-2">
              <input class="ym-input" value="ding_app_xxxx" placeholder="AppId / AppKey" />
              <input class="ym-input" type="password" value="••••••••" placeholder="AppSecret" />
              <input class="ym-input" value="cid_class_4_2==" placeholder="班级群 ID" />
              <input class="ym-input" value="https://oapi.dingtalk.com/robot/send..." placeholder="家庭私群 Webhook" />
            </div>
          </div>`;
      }

      // Default: TODAY
      return `
        <div class="ym-kpi-row">
          <div class="ym-card"><div class="ym-muted">今日作业进度</div><div class="ym-kpi-num">2 / 3</div></div>
          <div class="ym-card"><div class="ym-muted">待家长确认</div><div class="ym-kpi-num">1 项</div></div>
          <div class="ym-card"><div class="ym-muted">自定义任务</div><div class="ym-kpi-num">1 / 2</div></div>
        </div>

        <div class="ym-card">
          <div class="ym-card-head"><h2 class="ym-card-title">今日作业</h2><span class="ym-badge ok">钉钉已同步</span></div>
          <div class="ym-list">
            <div class="ym-row">
              <div class="ym-row-left"><span class="ym-dot ok"></span><div><div class="ym-row-title">数学 · 练习册第 24 页 1–5 题</div><div class="ym-row-sub">次日交纸质</div></div></div>
              <span class="ym-badge ok">已写完</span>
            </div>
            <div class="ym-row">
              <div class="ym-row-left"><span class="ym-dot"></span><div><div class="ym-row-title">英语 · 朗读 Unit 3 课文</div><div class="ym-row-sub">钉钉家校本提交</div></div></div>
              <span class="ym-badge warn">待提交</span>
            </div>
          </div>
        </div>

        <div class="ym-grid-2">
          <div class="ym-card">
            <div class="ym-card-head"><h2 class="ym-card-title">待办</h2><span class="ym-badge warn">1 项</span></div>
            <div class="ym-row">
              <div class="ym-row-left"><span class="ym-dot warn"></span><div><div class="ym-row-title">语文 · 背诵第 8 课第 2 段</div><div class="ym-row-sub">需家长核对提交</div></div></div>
              <button class="ym-btn ym-btn-primary" type="button">确认</button>
            </div>
          </div>
          <div class="ym-card ym-card-soft">
            <div class="ym-card-head"><h2 class="ym-card-title">预习与复习</h2><span class="ym-badge">2 项</span></div>
            <div class="ym-list">
              <div class="ym-row"><span class="ym-row-title">复习 · 三位数乘两位数错题</span><span class="ym-badge">复习</span></div>
              <div class="ym-row"><span class="ym-row-title">预习 · 语文第 9 课带 1 个问题</span><span class="ym-badge">预习</span></div>
            </div>
          </div>
        </div>

        <div class="ym-grid-2">
          <div class="ym-card">
            <div class="ym-card-head"><h2 class="ym-card-title">自定义任务</h2><span class="ym-badge ok">生命周期管理</span></div>
            <div class="ym-list">
              <div class="ym-row">
                <div class="ym-row-left"><button class="ym-btn ym-btn-primary" type="button" style="padding:4px 10px;">已完成</button><div><div class="ym-row-title">睡前阅读 20 分钟</div><div class="ym-row-sub">每日重复 · 连胜 5 天</div></div></div>
                <span class="ym-muted">暂停 · 编辑</span>
              </div>
              <div class="ym-row">
                <div class="ym-row-left"><button class="ym-btn ym-btn-ghost" type="button" style="padding:4px 10px;">打卡</button><div><div class="ym-row-title">练字 1 页</div><div class="ym-row-sub">工作日 · 进行中</div></div></div>
                <span class="ym-muted">暂停 · 编辑</span>
              </div>
            </div>
          </div>
          <div class="ym-card">
            <div class="ym-card-head"><h2 class="ym-card-title">教师今日反馈</h2><span class="ym-badge ok">班级群同步</span></div>
            <div class="ym-row">
              <div><span class="ym-badge ok">老师表扬</span><div class="ym-row-title" style="margin-top:4px;">王老师表扬小禾数学课堂主动上台讲题</div></div>
              <button class="ym-btn ym-btn-ghost" type="button">记入成长</button>
            </div>
          </div>
        </div>`;
    }

    function renderAppShell(styleId, page, interactive) {
      const navClick = (p) => interactive ? `onclick="setPage('${p}')"` : '';
      return `
        <div class="yami-app theme-${styleId}">
          <header class="ym-header">
            <div class="ym-brand"><div class="ym-logo">芽</div><span>芽米 · 家长端</span></div>
            <nav class="ym-nav-top">
              <button type="button" class="ym-nav-item ${page==='today'?'active':''}" ${navClick('today')}>今日</button>
              <button type="button" class="ym-nav-item ${page==='growth'?'active':''}" ${navClick('growth')}>成长</button>
              <button type="button" class="ym-nav-item ${page==='skills'?'active':''}" ${navClick('skills')}>技能</button>
              <button type="button" class="ym-nav-item ${page==='settings'?'active':''}" ${navClick('settings')}>设置</button>
            </nav>
            <div class="ym-header-right">
              <button type="button" class="ym-chip-btn"><span class="ym-avatar">禾</span><span>小禾</span></button>
              <button type="button" class="ym-chip-btn">家长账号</button>
              <button type="button" class="ym-chip-btn">帮助</button>
            </div>
          </header>
          <div class="ym-shell">
            <aside class="ym-sidebar">
              <button type="button" class="ym-side-btn ${page==='today'?'active':''}" ${navClick('today')}>今日</button>
              <button type="button" class="ym-side-btn ${page==='growth'?'active':''}" ${navClick('growth')}>成长</button>
              <button type="button" class="ym-side-btn ${page==='skills'?'active':''}" ${navClick('skills')}>技能</button>
              <button type="button" class="ym-side-btn ${page==='settings'?'active':''}" ${navClick('settings')}>设置</button>
            </aside>
            <main class="ym-main">${renderMockContent(page)}</main>
          </div>
        </div>`;
    }

    function render() {
      document.querySelectorAll('#mode-pills .studio-btn').forEach((b) => b.classList.toggle('active', b.dataset.mode === currentMode));
      document.querySelectorAll('#page-tabs .studio-tab').forEach((b) => b.classList.toggle('active', b.dataset.page === currentPage));
      const stage = document.getElementById('stage');

      if (currentMode === 'overview') {
        stage.innerHTML = `
          <div class="overview-wrap">
            <div class="overview-grid">
              ${STYLES.map((s) => `
                <div class="style-card-outer">
                  <div class="style-card-meta">
                    <div>
                      <div class="style-card-name">${s.name}</div>
                      <div class="style-card-desc">${s.desc}</div>
                      <div class="swatches">${s.swatches.map((c) => `<span class="sw" style="background:${c}"></span>`).join('')}</div>
                    </div>
                    <button class="open-full-btn" onclick="setMode('${s.id}')">全屏预览</button>
                  </div>
                  <div class="preview-viewport" onclick="setMode('${s.id}')">
                    <div class="preview-scaler">${renderAppShell(s.id, currentPage, false)}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>`;
      } else {
        stage.innerHTML = `<div class="full-stage">${renderAppShell(currentMode, currentPage, true)}</div>`;
      }
    }

    function setMode(m) { currentMode = m; render(); window.scrollTo({ top: 0, behavior: 'instant' }); }
    function setPage(p) { currentPage = p; render(); }

    render();
  </script>
</body>
</html>
