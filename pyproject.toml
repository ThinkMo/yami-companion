[project]
name = "yami-companion"
version = "0.1.0"
description = "芽米学习伙伴服务端（Mosaico 桌面学习伙伴 + 家长网页）"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "dingtalk-stream>=0.24.0",
]

[project.optional-dependencies]
prod = [
    "psycopg2-binary>=2.9.9",
    "neo4j>=5.20.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
